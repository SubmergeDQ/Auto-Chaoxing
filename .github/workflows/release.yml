# 打 tag（v*）时自动构建双端产物并发布 GitHub Release。
#
# 资产命名是客户端检查更新的约定（见 lib/core/update/app_release.dart）：
#   Android → *arm64-v8a*.apk
#   Windows → *windows*.zip
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: build android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          # 与 ci.yml 保持一致，避免 stable 漂移导致 AGP 最低要求变化。
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      # 按 ABI 分包：客户端优先挑 arm64-v8a，通用包体积太大。
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  windows:
    name: build windows zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 与 ci.yml 保持一致，避免 stable 漂移导致 AGP 最低要求变化。
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      # 安装器优先于 zip：客户端挑资产时优先 setup exe，升级体验更好。
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Package windows zip and installer
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tool/package_windows.ps1 -SkipBuild -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" $(find artifacts -type f) --title "$TAG" --generate-notes
