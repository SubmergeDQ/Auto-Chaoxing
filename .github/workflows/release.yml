# 打 tag（v*）时自动构建双端产物并发布 GitHub Release。
#
# 资产命名是客户端检查更新的约定（见 lib/core/update/app_release.dart）：
#   Android → *arm64-v8a*.apk
#   Windows → *windows*.zip
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: build android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          # 与 ci.yml 保持一致，避免 stable 漂移导致 AGP 最低要求变化。
          flutter-version: '3.47.9'
          cache: true
      # 固定签名：证书与口令只存在 GitHub Secrets，构建时还原，不入库。
      # 没配置时退回 debug 签名（仍可构建，但不同次构建无法覆盖升级）。
      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64，本次退回 debug 签名"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.jks
          EOF
      - run: flutter pub get
      # 按 ABI 分包：客户端优先挑 arm64-v8a，通用包体积太大。
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  windows:
    name: build windows zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 与 ci.yml 保持一致，避免 stable 漂移导致 AGP 最低要求变化。
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      # 安装器优先于 zip：客户端挑资产时优先 setup exe，升级体验更好。
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Package windows zip and installer
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tool/package_windows.ps1 -SkipBuild -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      # 发布说明从 CHANGELOG.md 提取，publish job 也需要仓库内容。
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # 发布说明直接取 CHANGELOG 里对应版本的段落：内容由人写，格式与仓库记录一致。
      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" 'index($0, "## " ver " ") == 1 {flag=1; next} /^## / {if (flag) exit} flag' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md 缺少 $VERSION 段落"; exit 1; }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" $(find artifacts -type f) --title "$TAG" --notes-file release-notes.md
