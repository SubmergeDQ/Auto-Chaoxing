name: auto_chaoxing
description: 跨平台（Android / Windows）学习通课程自动化客户端
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

# 说明：第三方插件先不锁版本，首次 `flutter pub get` 成功后请回填精确版本并提交 pubspec.lock。
# 这类插件迭代快，宽范围会导致"我这能编、你那不能编"。
dependencies:
  flutter:
    sdk: flutter
  dio: any
  cookie_jar: any
  dio_cookie_manager: any
  crypto: any
  pointycastle: any
  flutter_secure_storage: any
  shared_preferences: any
  path_provider: any
  intl: any
  # 平台能力（按需启用，未启用前不影响编译）
  # flutter_foreground_task: any      # Android 前台服务
  # flutter_inappwebview: any         # Android 登录/作业提交
  # webview_windows: any              # Windows 登录兜底
  # flutter_local_notifications: any  # 通知
  # tray_manager: any                 # Windows 托盘

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
