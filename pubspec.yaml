name: auto_chaoxing
description: 跨平台（Android / Windows）学习通课程自动化客户端
publish_to: "none"
version: 0.4.1+14

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

# 依赖已按首次 pub get 的解析结果回填 caret 版本；pubspec.lock 是可复现构建的唯一基准，
# 升级依赖后必须一并提交 lock 文件，避免"我这能编、你那不能编"。
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  crypto: ^3.0.8
  pointycastle: ^4.0.0
  # 没有 flutter_secure_storage：本项目不保存密码，只把登录会话（cookie）落盘。
  # 它的 Windows 实现依赖 ATL（atlstr.h），会让本机 MSVC 构建直接失败，
  # 而我们根本用不到那个能力，不如不引入。
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  intl: ^0.20.3
  url_launcher: ^6.3.3
  window_manager: ^0.6.0
  tray_manager: ^0.8.3
  # 平台能力（按需启用，未启用前不影响编译）
  # flutter_foreground_task: any      # Android 前台服务
  # flutter_inappwebview: any         # Android 登录/作业提交
  # webview_windows: any              # Windows 登录兜底
  # flutter_local_notifications: any  # 通知
  # tray_manager: any                 # Windows 托盘

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # 托盘图标（运行时从 asset 落到临时文件，tray_manager 只认真实路径）
    - assets/tray.ico
